spring:
  datasource:
    url: jdbc:h2:mem:evops-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  quartz:
    auto-startup: false

shiro:
  annotations:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 测试中关闭窗口收窄定时扫描，避免后台线程干扰事务回滚测试
evops:
  shift-warning:
    scan:
      enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:evops-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  quartz:
    auto-startup: false

shiro:
  annotations:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
